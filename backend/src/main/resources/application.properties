spring.application.name=SmartLabBackend
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties],optional:file:./lab/backend/.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret.key=${JWT_SECRET}

server.servlet.context-path=/api/v1.0
smartlab.openapi.server-url=http://localhost:8080/api/v1.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

smartlab.invite.ttl-hours=72
smartlab.frontend.base-url=${FRONTEND_BASE_URL:http://127.0.0.1:5173}
smartlab.session.max-active=3
smartlab.session.ttl-days=30

smartlab.storage.provider=${SMARTLAB_STORAGE_PROVIDER:google-drive}
smartlab.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
smartlab.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
smartlab.google-drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
smartlab.google-drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}
smartlab.file.max-size-bytes=${SMARTLAB_FILE_MAX_SIZE_BYTES:26214400}

spring.servlet.multipart.max-file-size=${SMARTLAB_FILE_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SMARTLAB_FILE_MAX_REQUEST_SIZE:30MB}

# Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM:}